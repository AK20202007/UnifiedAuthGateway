name: UnifiedAuthGateway CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Auth Server Dependencies
      run: |
        python -m pip install --upgrade pip
        cd auth_server
        pip install django django-oauth-toolkit pyjwt cryptography jwcrypto
        
    - name: Check Auth Server
      run: |
        cd auth_server
        python generate_keys.py
        python manage.py check
        
    - name: Install Django API Dependencies
      run: |
        cd django_api
        pip install django djangorestframework django-oauth-toolkit pyjwt cryptography
        
    - name: Check Django API
      run: |
        cd django_api
        python manage.py check

  test-java-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Test Spring Boot API
      run: |
        cd springboot_api
        chmod +x mvnw
        ./mvnw test
